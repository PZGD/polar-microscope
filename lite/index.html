        const TEACHER = new URLSearchParams(location.hash.slice(1)).get('teacher') === '1';

        // ===== 결정 그레인 생성 =====
        let grains = [];
        let selectedGrain = null; // 클릭으로 선택된 알갱이

        function generateGrains(mineral) {
            grains = [];
            selectedGrain = null;
            // 4× 저배율에서도 시야가 차도록 10× 시야의 2.5배 반경까지 박편을 채운다 (면적 6.25배)
            const numGrains = Math.round((14 + Math.floor(Math.random() * 8)) * 6.25);
            const attempts = [];

            for (let i = 0; i < numGrains; i++) {
                for (let t = 0; t < 60; t++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.sqrt(Math.random()) * (FIELD_R - 30); // 면적에 고르게
                    const gx = CX + Math.cos(angle) * dist;
                    const gy = CY + Math.sin(angle) * dist;
                    const size = 28 + Math.random() * 48;

                    let overlaps = false;
                    for (const g of attempts) {
                        const dx = g.x - gx, dy = g.y - gy;
                        if (Math.sqrt(dx * dx + dy * dy) < (g.size + size) * 0.38) {
                            overlaps = true;
                            break;
                        }
                    }
                    if (overlaps) continue;

                    const orientation = Math.random() * 180;
                    // 단면 종류 — longCleavage가 있는 광물(각섬석·휘석)만 기저/세로 단면을 나눈다
                    const section = mineral.longCleavage ? (Math.random() < 0.35 ? 'basal' : 'long') : null;
                    const vertices = generateCrystalShape(mineral, size, section);
                    const bireFactor = 0.55 + Math.random() * 0.45; // 단면 방향에 따라 Δn이 최대값 이하로만 나옴

                    // 쌍정 데이터 (사장석 알바이트 쌍정)
                    let twinData = null;
                    if (mineral.twinning === 'albite') {
                        // 각 그레인마다 고유한 쌍정 방향 (라멜라가 달리는 각도)
                        const twinDirection = Math.random() * Math.PI; // 0~180°
                        // 라멜라 개수 (폭 변화를 위해 경계 위치를 직접 지정)
                        const numBands = 6 + Math.floor(Math.random() * 8);
                        const boundaries = [0]; // 0~1 사이 정규화된 경계 위치
                        for (let bi = 1; bi < numBands; bi++) {
                            // 불규칙한 간격 (하지만 대체로 균등)
                            const base = bi / numBands;
                            const jitter = (Math.random() - 0.5) * 0.4 / numBands;
                            boundaries.push(Math.max(boundaries[bi-1] + 0.02, Math.min(0.98, base + jitter)));
                        }
                        boundaries.push(1);
                        twinData = {
                            direction: twinDirection,
                            boundaries: boundaries,
                            twinAngle: mineral.twinAngle, // 쌍정 간 결정학적 방향 차이
                            // 각 쌍정 도메인의 복굴절률 미세 변동
                            bireFactors: boundaries.slice(0, -1).map(() => 0.9 + Math.random() * 0.1)
                        };
                    }

                    // 소광 하위구역 (파동소광·얼룩소광)
                    let subzones = null;
                    if (mineral.extinctionType === 'undulatory') {
                        // 방사형 부채꼴 조각 — 조각마다 소광 위상이 조금씩 어긋나 물결무늬 소광
                        subzones = [];
                        const zn = 6;
                        const a0 = Math.random() * Math.PI * 2;
                        for (let zi = 0; zi < zn; zi++) {
                            subzones.push({
                                kind: 'wedge',
                                a0: a0 + (zi / zn) * Math.PI * 2,
                                a1: a0 + ((zi + 1) / zn) * Math.PI * 2,
                                phaseOffset: (Math.random() - 0.5) * 14 // ±7°
                            });
                        }
                    } else if (mineral.extinctionType === 'mottled') {
                        // 얼룩 패치 — 타원 여러 개, 각각 소광 위상이 다름
                        subzones = [];
                        const zn = 4 + Math.floor(Math.random() * 2);
                        for (let zi = 0; zi < zn; zi++) {
                            const za = Math.random() * Math.PI * 2;
                            const zd = Math.random() * size * 0.5;
                            subzones.push({
                                kind: 'blob',
                                x: Math.cos(za) * zd * 1.4, y: Math.sin(za) * zd,
                                rx: size * (0.25 + Math.random() * 0.2),
                                ry: size * (0.18 + Math.random() * 0.15),
                                phaseOffset: (Math.random() - 0.5) * 20 // ±10°
                            });
                        }
                    }

                    // 변질(뿌연 표면) 패치 — 정장석 등
                    let alterPatches = null;
                    if (mineral.alteration > 0) {
                        alterPatches = [];
                        const pn = Math.round(14 + mineral.alteration * 14);
                        for (let pi = 0; pi < pn; pi++) {
                            const pa = Math.random() * Math.PI * 2;
                            const pd = Math.random() * size * 0.75;
                            alterPatches.push({
                                x: Math.cos(pa) * pd * 1.4, y: Math.sin(pa) * pd,
                                r: 1.5 + Math.random() * size * 0.18,
                                alpha: 0.05 + Math.random() * 0.10 * mineral.alteration
                            });
                        }
                    }

                    const grain = {
                        x: gx, y: gy, size, orientation,
                        vertices, bireFactor,
                        thickness: 29 + Math.random() * 2,
                        section,
                        // 단면별 벽개·소광각: 기저 단면은 대칭 소광(0°), 세로 단면은 1방향 벽개
                        cleavageAngles: section === 'basal' ? mineral.cleavageAngles
                            : section === 'long' ? mineral.longCleavage
                            : mineral.cleavageAngles,
                        extAngle: section === 'basal' ? 0 : mineral.extinctionAngle,
                        twinData, subzones, alterPatches,
                        cleavageSpacing: 4.5 + Math.random() * 2.5 // 벽개 간격 고정 (렌더마다 안 바뀌게)
                    };
                    grains.push(grain);
                    attempts.push(grain);
                    break;
                }
            }
        }

        function generateCrystalShape(mineral, size, section) {
            const verts = [];
            let numSides;
            if (section === 'long') {
                numSides = 4 + Math.floor(Math.random() * 3); // 세로 단면: 길쭉한 4~6각형
            } else if (section === 'basal') {
                numSides = mineral.id === 'augite' ? 8 : 6; // 기저 단면: 각섬석 6각형, 휘석 8각형
            } else {
                switch (mineral.crystalSystem) {
                    case 'hexagonal': numSides = 6; break;
                    case 'cubic': numSides = 6 + Math.floor(Math.random() * 2); break; // 등축계: 다각형 자형
                    case 'orthorhombic': numSides = 4 + Math.floor(Math.random() * 2); break;
                    case 'monoclinic': numSides = 4 + Math.floor(Math.random() * 3); break;
                    case 'triclinic': numSides = 4 + Math.floor(Math.random() * 2); break;
                    default: numSides = 5 + Math.floor(Math.random() * 3);
                }
            }
            const baseAngle = Math.random() * Math.PI * 2;
            for (let i = 0; i < numSides; i++) {
                const a = baseAngle + (i / numSides) * Math.PI * 2;
                // 등축계·기저 단면은 규칙적인 다각형에 가깝게 (반지름 변동 폭 축소)
                const rVar = section === 'basal' ? 0.88 + Math.random() * 0.12
                    : mineral.crystalSystem === 'cubic' ? 0.85 + Math.random() * 0.15 : 0.6 + Math.random() * 0.4;
                const r = size * rVar;
                const elongation = section === 'long' ? 2.0
                    : section === 'basal' ? 1.0
                    : (mineral.id === 'biotite' || mineral.id === 'muscovite') ? 1.8
                    : (mineral.id === 'plagioclase') ? 1.5
                    : (mineral.id === 'garnet') ? 1.0
                    : (mineral.id === 'calcite') ? 1.3 : 1.2;
                verts.push([Math.cos(a) * r * elongation, Math.sin(a) * r]);
            }
            return verts;
        }

        // ===== Michel-Lévy 간섭색 계산 =====
        function xFit(wave) {
            const t1 = (wave - 442.0) * ((wave < 442.0) ? 0.0624 : 0.0374);
            const t2 = (wave - 599.8) * ((wave < 599.8) ? 0.0264 : 0.0323);
            const t3 = (wave - 501.1) * ((wave < 501.1) ? 0.0490 : 0.0382);
            return 0.362 * Math.exp(-0.5 * t1 * t1) + 1.056 * Math.exp(-0.5 * t2 * t2)
                - 0.065 * Math.exp(-0.5 * t3 * t3);
        }

        function yFit(wave) {
            const t1 = (wave - 568.8) * ((wave < 568.8) ? 0.0213 : 0.0247);
            const t2 = (wave - 530.9) * ((wave < 530.9) ? 0.0613 : 0.0322);
            return 0.821 * Math.exp(-0.5 * t1 * t1) + 0.286 * Math.exp(-0.5 * t2 * t2);
        }

        function zFit(wave) {
            const t1 = (wave - 437.0) * ((wave < 437.0) ? 0.0845 : 0.0278);
            const t2 = (wave - 459.0) * ((wave < 459.0) ? 0.0385 : 0.0725);
            return 1.217 * Math.exp(-0.5 * t1 * t1) + 0.681 * Math.exp(-0.5 * t2 * t2);
        }

        // 간섭색 LUT — 10nm 간격으로 계산(600개), 사이는 선형 보간
        // 6000nm까지 확장: 방해석 같은 고복굴절 광물의 고차 백색 표현용
        const LUT_STEP = 10;
        const LUT_MAX = 6000;
        const LUT_N = LUT_MAX / LUT_STEP + 1; // 601
        const interferenceColorLUT = new Array(LUT_N);

        // 등색함수 표 (380~780nm, 10nm 간격) — 매번 다시 계산하지 않도록 미리 저장
        const WAVES = [], XB = [], YB = [], ZB = [];
        for (let lambda = 380; lambda <= 780; lambda += 10) {
            WAVES.push(lambda); XB.push(xFit(lambda)); YB.push(yFit(lambda)); ZB.push(zFit(lambda));
        }

        function calcOneRetardation(R) {
            return spectrumToRGB(i => Math.sin(Math.PI * R / WAVES[i]) ** 2);
        }

        // 파장별 투과 세기 함수(intensityAt(i), i = WAVES 인덱스) → sRGB
        function spectrumToRGB(intensityAt) {
            let X = 0, Y = 0, Z = 0;
            for (let i = 0; i < WAVES.length; i++) {
                const power = intensityAt(i);
                X += power * XB[i];
                Y += power * YB[i];
                Z += power * ZB[i];
            }
            let r = 3.2406*X - 1.5372*Y - 0.4986*Z;
            let g = -0.9689*X + 1.8758*Y + 0.0415*Z;
            let b = 0.0557*X - 0.2040*Y + 1.0570*Z;
            const mx = Math.max(r, g, b, 1);
            r /= mx; g /= mx; b /= mx;
            const gc = v => v > 0.0031308 ? 1.055*Math.pow(Math.max(0,v),1/2.4)-0.055 : 12.92*Math.max(0,v);
            return [
                Math.max(0, Math.min(255, Math.round(gc(r)*255))),
                Math.max(0, Math.min(255, Math.round(gc(g)*255))),
                Math.max(0, Math.min(255, Math.round(gc(b)*255)))
            ];
        }

        function buildLUT() {
            for (let i = 0; i < LUT_N; i++) {
                interferenceColorLUT[i] = calcOneRetardation(i * LUT_STEP);
            }
        }
        buildLUT();

        function retardationToRGB(retardation) {
            const clamped = Math.max(0, Math.min(LUT_MAX, retardation));
            const fi = clamped / LUT_STEP;
            const i0 = Math.floor(fi);
            const i1 = Math.min(i0 + 1, LUT_N - 1);
            const t = fi - i0;
            const c0 = interferenceColorLUT[i0];
            const c1 = interferenceColorLUT[i1];
            return [
                Math.round(c0[0] + (c1[0] - c0[0]) * t),
                Math.round(c0[1] + (c1[1] - c0[1]) * t),
                Math.round(c0[2] + (c1[2] - c0[2]) * t)
            ];
        }

        // 직교니콜 + 보상기: 광물판(경로차 Rg, 진동방향 thetaG)과 보상기(경로차 Rc, 느린 방향 = 화면 북동-남서, 호출 시 각도 부호 반전)를
        // 차례로 통과한 빛의 세기를 파장마다 계산(존스 행렬). 광물이 소광 위치(thetaG=0)면 보상기 색 그대로,
        // 보상기와 평행(45°)이면 경로차가 더해지고(가산), 수직(135°)이면 빼진다(감산).
        function compensatedRGB(Rg, thetaG, Rc) {
            const s2 = Math.sin(2 * thetaG), c2 = Math.cos(2 * thetaG);
            return spectrumToRGB(i => {
                const hg = Math.PI * Rg / WAVES[i], hc = Math.PI * Rc / WAVES[i]; // 위상차의 절반
                const Sg = Math.sin(hg), Cg = Math.cos(hg), Sc = Math.sin(hc), Cc = Math.cos(hc);
                const re = Sc * Sg * c2;
                const im = Sc * Cg + Cc * Sg * s2;
                return re * re + im * im;
            });
        }

        function getInterferenceOrder(retardation) {
            if (retardation >= 3000) return '고차 백색';
            if (retardation < 550) return '1차';
            if (retardation < 1100) return '2차';
            if (retardation < 1650) return '3차';
            return `${Math.floor(retardation / 550) + 1}차`;
        }

        // ===== 그레인 색상 계산 =====
        // phaseOffset: 파동소광·얼룩소광 하위구역의 소광 위상 어긋남(°)
        function calculateGrainColor(grain, mineral, mode, stageAngle, phaseOffset = 0) {
            const stageRad = stageAngle * Math.PI / 180;
            const orientRad = grain.orientation * Math.PI / 180;
            const mineralAngle = orientRad + stageRad;
            const lf = getLightFactor();

            if (mode === 'ppl') {
                // PPL: 다색성만 (보상기는 분석기가 없으므로 효과 없음)
                const pplAngle = mineralAngle % Math.PI;
                const f = Math.cos(pplAngle) * Math.cos(pplAngle);
                return {
                    r: Math.min(255, Math.round((mineral.colorA[0] * f + mineral.colorB[0] * (1 - f)) * lf)),
                    g: Math.min(255, Math.round((mineral.colorA[1] * f + mineral.colorB[1] * (1 - f)) * lf)),
                    b: Math.min(255, Math.round((mineral.colorA[2] * f + mineral.colorB[2] * (1 - f)) * lf))
                };
            } else {
                // 등방성 광물(석류석 등): 어느 방향에서도 완전 소광
                if (mineral.opticType === 'isotropic') {
                    // 빛이 갈라지지 않으므로 보상기만 있는 것과 같음 (보상기 없으면 검정)
                    const isoR = getCompensatorR();
                    if (isoR > 0) {
                        const c = retardationToRGB(isoR);
                        return {
                            r: Math.max(0, Math.min(255, Math.round(c[0] * lf))),
                            g: Math.max(0, Math.min(255, Math.round(c[1] * lf))),
                            b: Math.max(0, Math.min(255, Math.round(c[2] * lf)))
                        };
                    }
                    return { r: 0, g: 0, b: 0 };
                }

                // XPL: 간섭색 + 소광 (사소광은 소광각만큼 위상 이동, 그레인 단면의 소광각 우선)
                const effAngle = mineralAngle - (((grain.extAngle ?? mineral.extinctionAngle) + phaseOffset) * Math.PI / 180);
                const extinction = Math.sin(2 * effAngle);
                const ext2 = extinction * extinction;

                const retardation = mineral.birefringence * grain.bireFactor * grain.thickness * 1000;

                // 보상기 삽입: 광물판 + 보상기를 함께 계산 (소광 위치여도 검정이 아니라 보상기 색)
                const compR = getCompensatorR();
                if (compR > 0) {
                    const c = compensatedRGB(retardation, -effAngle, compR);
                    return {
                        r: Math.max(0, Math.min(255, Math.round(c[0] * lf))),
                        g: Math.max(0, Math.min(255, Math.round(c[1] * lf))),
                        b: Math.max(0, Math.min(255, Math.round(c[2] * lf)))
                    };
                }
                const rgb = retardationToRGB(retardation);

                // 강한 다색성 광물: 고유색이 간섭색에 영향 (비정상 간섭색)
                let r = rgb[0] * ext2;
                let g = rgb[1] * ext2;
                let b = rgb[2] * ext2;

                if (mineral.pleochroismStrength > 0.5) {
                    const tint = mineral.pleochroismStrength * 0.25;
                    const pplAngle = mineralAngle % Math.PI;
                    const f = Math.cos(pplAngle) * Math.cos(pplAngle);
                    const pr = mineral.colorA[0] * f + mineral.colorB[0] * (1 - f);
                    const pg = mineral.colorA[1] * f + mineral.colorB[1] * (1 - f);
                    const pb = mineral.colorA[2] * f + mineral.colorB[2] * (1 - f);
                    r = r * (1 - tint) + pr * tint * ext2 * 0.5;
                    g = g * (1 - tint) + pg * tint * ext2 * 0.5;
                    b = b * (1 - tint) + pb * tint * ext2 * 0.5;
                }

                return {
                    r: Math.max(0, Math.min(255, Math.round(r * lf))),
                    g: Math.max(0, Math.min(255, Math.round(g * lf))),
                    b: Math.max(0, Math.min(255, Math.round(b * lf)))
                };
            }
        }

        // ===== 코노스코프 (버틀랜드 렌즈) 렌더링 =====
        // 오프스크린 캔버스 (코노스코프 저해상도 계산용)
        const cono = document.createElement('canvas');
        const CSCALE = 2; // 다운샘플 비율
        cono.width = Math.ceil(W / CSCALE);
        cono.height = Math.ceil(H / CSCALE);
        const conoCtx = cono.getContext('2d');

        function renderConoscopic(mineral, stageAngle) {
            // 등방성 광물: 간섭상이 형성되지 않음 (시야 전체 소광)
            if (mineral.opticType === 'isotropic') {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, W, H);
                // 보상기가 있으면 원 전체가 보상기 색 (빛이 갈라지지 않음)
                const isoR = getCompensatorR();
                if (isoR > 0) {
                    const c = retardationToRGB(isoR);
                    ctx.fillStyle = `rgb(${Math.round(c[0])}, ${Math.round(c[1])}, ${Math.round(c[2])})`;
                    ctx.beginPath();
                    ctx.arc(CX, CY, RADIUS, 0, Math.PI * 2);
                    ctx.fill();
                }
                return;
            }
            // 보상기 경로차는 한 번만 읽는다 (픽셀마다 DOM을 읽지 않게). 쐐기는 20nm 단위로 반올림
            let compR = getCompensatorR();
            if (document.getElementById('comp-select').value === 'wedge' && compR > 0) compR = Math.max(20, Math.round(compR / 20) * 20);

            const sw = cono.width, sh = cono.height;
            const scx = CX / CSCALE, scy = CY / CSCALE;
            const smaxR = RADIUS / CSCALE;
            const imageData = conoCtx.createImageData(sw, sh);
            const data = imageData.data;
            const stageRad = stageAngle * Math.PI / 180;

            if (mineral.opticType === 'uniaxial') {
                renderUniaxialFigure(data, mineral, stageRad, sw, sh, scx, scy, smaxR, compR);
            } else {
                renderBiaxialFigure(data, mineral, stageRad, sw, sh, scx, scy, smaxR, compR);
            }

            conoCtx.putImageData(imageData, 0, 0);
            // 저해상도 결과를 원본 캔버스에 확대
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'medium';
            ctx.drawImage(cono, 0, 0, W, H);
        }

        // 보상기 경로차 표: R 0~6000nm(10nm) x θ 0~180°(2°)의 RGB (보상기 경로차가 바뀔 때만 재생성)
        const compLUTCache = new Map(); // 보상기 경로차 → 표 (최근 4개 보관)
        const CLUT_NR = 601, CLUT_NT = 90;
        function buildCompLUT(Rc) {
            const lut = new Uint8ClampedArray(CLUT_NR * CLUT_NT * 3);
            for (let ri = 0; ri < CLUT_NR; ri++) {
                for (let ti = 0; ti < CLUT_NT; ti++) {
                    const c = compensatedRGB(ri * 10, ti * 2 * Math.PI / 180, Rc);
                    const k = (ri * CLUT_NT + ti) * 3;
                    lut[k] = c[0]; lut[k + 1] = c[1]; lut[k + 2] = c[2];
                }
            }
            return lut;
        }
        function getCompLUT(Rc) {
            let lut = compLUTCache.get(Rc);
            if (lut) { compLUTCache.delete(Rc); compLUTCache.set(Rc, lut); return lut; } // 최근 사용으로 갱신
            lut = buildCompLUT(Rc);
            compLUTCache.set(Rc, lut);
            if (compLUTCache.size > 4) compLUTCache.delete(compLUTCache.keys().next().value);
            return lut;
        }
        // 표 조회: 가장 가까운 칸, θ는 mod π로 접음
        function compLUTLookup(compLUT, R, theta) {
            const ri = Math.max(0, Math.min(CLUT_NR - 1, Math.round(R / 10)));
            let t = theta % Math.PI; if (t < 0) t += Math.PI;
            const ti = Math.round(t / (2 * Math.PI / 180)) % CLUT_NT;
            const k = (ri * CLUT_NT + ti) * 3;
            return [compLUT[k], compLUT[k + 1], compLUT[k + 2]];
        }

        // 한 점의 코노스코프 색: 진동 방향 psi, 경로차 R, 광학부호 sign
        function conoPixel(psi, R, sign, vignette, out, compR) {
            let r, g, b;
            if (compR > 0) {
                const lut = getCompLUT(compR);
                const thetaS = sign === '-' ? psi + Math.PI / 2 : psi; // 느린 방향
                const c = compLUTLookup(lut, R, -thetaS);
                r = c[0]; g = c[1]; b = c[2];
            } else {
                const rgb = retardationToRGB(R);
                const B = Math.sin(2 * psi) ** 2;
                r = rgb[0] * B; g = rgb[1] * B; b = rgb[2] * B;
            }
            out[0] = Math.min(255, r * vignette);
            out[1] = Math.min(255, g * vignette);
            out[2] = Math.min(255, b * vignette);
        }

        function renderUniaxialFigure(data, mineral, stageRad, sw, sh, scx, scy, smaxR, compR) {
            const bire = mineral.birefringence;
            const px3 = [0, 0, 0];

            for (let py = 0; py < sh; py++) {
                for (let px = 0; px < sw; px++) {
                    const dx = px - scx;
                    const dy = py - scy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > smaxR) continue;

                    const idx = (py * sw + px) * 4;
                    const normR = dist / smaxR;
                    // 진동 방향 = 방사 방향 (재물대 각도와 무관 — 십자는 제자리)
                    const psi = Math.atan2(dy, dx);
                    const R = bire * 30 * 1000 * 6 * normR * normR;
                    const vignette = 1 - Math.pow(normR, 4) * 0.3;
                    conoPixel(psi, R, mineral.opticSign, vignette, px3, compR);

                    data[idx]     = px3[0];
                    data[idx + 1] = px3[1];
                    data[idx + 2] = px3[2];
                    data[idx + 3] = 255;
                }
            }
        }

        function renderBiaxialFigure(data, mineral, stageRad, sw, sh, scx, scy, smaxR, compR) {
            const bire = mineral.birefringence;
            const twoVRad = mineral.twoV * Math.PI / 180;
            const melatopeSpacing = Math.sin(twoVRad / 2) * smaxR * 0.7;
            const cosS = Math.cos(stageRad), sinS = Math.sin(stageRad);
            const px3 = [0, 0, 0];

            for (let py = 0; py < sh; py++) {
                for (let px = 0; px < sw; px++) {
                    const dx = px - scx;
                    const dy = py - scy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > smaxR) continue;

                    const idx = (py * sw + px) * 4;
                    const rdx = dx * cosS + dy * sinS;
                    const rdy = -dx * sinS + dy * cosS;

                    // 두 멜라토프(-s,0), (+s,0)까지의 거리·방위각
                    const d1 = Math.hypot(rdx + melatopeSpacing, rdy);
                    const d2 = Math.hypot(rdx - melatopeSpacing, rdy);
                    const phi1 = Math.atan2(rdy, rdx + melatopeSpacing);
                    const phi2 = Math.atan2(rdy, rdx - melatopeSpacing);
                    // 비오-프레넬: 진동 방향 = 두 방위각의 평균 (재물대 좌표 -> 캔버스 각도)
                    const psi = (phi1 + phi2) / 2 + stageRad;
                    const R = bire * 30 * 1000 * 6 * (d1 * d2) / (smaxR * smaxR);

                    const normR = dist / smaxR;
                    const vignette = 1 - Math.pow(normR, 4) * 0.3;
                    conoPixel(psi, R, mineral.opticSign, vignette, px3, compR);

                    data[idx]     = px3[0];
                    data[idx + 1] = px3[1];
                    data[idx + 2] = px3[2];
                    data[idx + 3] = 255;
                }
            }
        }

        // ===== 렌더링 =====
        function render() {
            const mineralIdx = parseInt(mineralSelect.value);
            const mineral = minerals[mineralIdx];
            const stageAngle = parseFloat(stageSlider.value);

            ctx.clearRect(0, 0, W, H);

            if (currentMode === 'bertrand') {
                // 버틀랜드 렌즈: 코노스코프 관찰
                renderConoscopic(mineral, stageAngle);
                const conoLowMag = parseInt(document.getElementById('obj-select').value) !== 40;
                if (conoLowMag && mineral.opticType !== 'isotropic') {
                    // 저배율: 간섭상 밝기 0.55배 (검은 막을 덮어 어둡게)
                    ctx.fillStyle = 'rgba(0,0,0,0.45)';
                    ctx.fillRect(0, 0, W, H);
                }

                // 원형 마스크 (외부 검정)
                ctx.save();
                ctx.globalCompositeOperation = 'destination-in';
                ctx.beginPath();
                ctx.arc(CX, CY, RADIUS, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 40x가 아니면 배율 안내 띠
                if (conoLowMag) {
                    ctx.save();
                    // 원 안에 들어가도록 두 줄로 나눠 씀 (같은 문장)
                    // 화면에서 캔버스가 줄어 보이면(휴대폰) 글자·띠를 그만큼 키움
                    const bk = (canvas.clientWidth && canvas.clientWidth < canvas.width) ? Math.min(1.45, canvas.width / canvas.clientWidth) : 1;
                    const bandY = CY + RADIUS - 40 - 45 * (bk - 1);
                    ctx.font = (13 * bk) + 'px sans-serif';
                    const bw = bk > 1 ? Math.max(250, ctx.measureText('저배율에서는 간섭상이 작고 흐립니다').width + 16) : 250;
                    ctx.fillStyle = 'rgba(0,0,0,0.75)';
                    ctx.fillRect(CX - bw / 2, bandY - 28 * bk, bw, 38 * bk);
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('고배율(40×)에서 관찰하세요 —', CX, bandY - 18 * bk);
                    ctx.fillText('저배율에서는 간섭상이 작고 흐립니다', CX, bandY - 1 * bk + (bk - 1) * 4);
                    ctx.restore();
                }
            } else {
                // 정규 관찰 (PPL / XPL)
                ctx.save();
                ctx.beginPath();
                ctx.arc(CX, CY, RADIUS, 0, Math.PI * 2);
                ctx.clip();

                // 배경 (조명 밝기 반영; XPL에서 보상기 삽입 시 배경은 보상기 간섭색)
                const lf2 = getLightFactor();
                if (currentMode === 'ppl') {
                    const v = Math.min(255, Math.round(225 * lf2));
                    ctx.fillStyle = `rgb(${v}, ${v}, ${Math.min(255, v + 3)})`;
                } else {
                    const compR = getCompensatorR();
                    if (compR > 0) {
                        const c = retardationToRGB(compR);
                        ctx.fillStyle = `rgb(${Math.round(c[0] * lf2)}, ${Math.round(c[1] * lf2)}, ${Math.round(c[2] * lf2)})`;
                    } else {
                        const v = Math.round(5 * lf2);
                        ctx.fillStyle = `rgb(${v}, ${v}, ${Math.min(255, v + 3)})`;
                    }
                }
                ctx.fillRect(0, 0, W, H);

                // 재물대 전체 회전 + 대물렌즈 배율 (10× 기준)
                const zoom = parseInt(document.getElementById('obj-select').value) / 10;
                // 보상기 색 배경 위에서는 반투명이면 배경색과 섞여 가산·감산이 흐려지므로 거의 불투명하게
                const alphaBase = (currentMode === 'xpl' && getCompensatorR() > 0)
                    ? Math.max(mineral.opacity, 0.85) : mineral.opacity;
                ctx.save();
                ctx.translate(CX, CY);
                ctx.scale(zoom, zoom);
                ctx.rotate(stageAngle * Math.PI / 180);
                ctx.translate(-CX, -CY);

                const viewR = RADIUS / zoom; // 현재 배율에서 보이는 박편 반경
                grains.forEach(grain => {
                    if (Math.hypot(grain.x - CX, grain.y - CY) > viewR + grain.size * 2) return; // 시야 밖 생략
                    ctx.save();
                    ctx.translate(grain.x, grain.y);
                    ctx.rotate(grain.orientation * Math.PI / 180);

                    // 결정 윤곽 경로 함수
                    function tracePath() {
                        ctx.beginPath();
                        ctx.moveTo(grain.vertices[0][0], grain.vertices[0][1]);
                        for (let i = 1; i < grain.vertices.length; i++) {
                            ctx.lineTo(grain.vertices[i][0], grain.vertices[i][1]);
                        }
                        ctx.closePath();
                    }

                    if (grain.twinData) {
                        // === 알바이트 쌍정 렌더링 ===
                        const td = grain.twinData;
                        const dir = td.direction; // 쌍정 라멜라 방향
                        const cosD = Math.cos(dir), sinD = Math.sin(dir);

                        // 바운딩 박스 (쌍정 방향 좌표계로 투영)
                        let minProj = Infinity, maxProj = -Infinity;
                        let minPerp = Infinity, maxPerp = -Infinity;
                        grain.vertices.forEach(v => {
                            // 쌍정 방향에 수직인 축으로 투영
                            const proj = v[0] * (-sinD) + v[1] * cosD;
                            const perp = v[0] * cosD + v[1] * sinD;
                            minProj = Math.min(minProj, proj);
                            maxProj = Math.max(maxProj, proj);
                            minPerp = Math.min(minPerp, perp);
                            maxPerp = Math.max(maxPerp, perp);
                        });
                        const projRange = maxProj - minProj;
                        const perpLen = maxPerp - minPerp;

                        // 클리핑
                        tracePath();
                        ctx.save();
                        ctx.clip();

                        // 각 쌍정 밴드 렌더링
                        const pad = 4; // 라멜라 길이 여백
                        for (let bi = 0; bi < td.boundaries.length - 1; bi++) {
                            const b0 = td.boundaries[bi];
                            const b1 = td.boundaries[bi + 1];
                            const isTwinned = (bi % 2 === 1);

                            // 이 밴드의 결정학적 방향
                            const orientOffset = isTwinned ? td.twinAngle : 0;
                            const virtualGrain = {
                                ...grain,
                                orientation: grain.orientation + orientOffset,
                                bireFactor: grain.bireFactor * td.bireFactors[bi]
                            };
                            const color = calculateGrainColor(virtualGrain, mineral, currentMode, stageAngle);

                            // 밴드 사각형 (쌍정 방향 좌표계)
                            const p0 = minProj + b0 * projRange;
                            const p1 = minProj + b1 * projRange;
                            const corners = [
                                [p0 * (-sinD) + (minPerp - pad) * cosD, p0 * cosD + (minPerp - pad) * sinD],
                                [p1 * (-sinD) + (minPerp - pad) * cosD, p1 * cosD + (minPerp - pad) * sinD],
                                [p1 * (-sinD) + (maxPerp + pad) * cosD, p1 * cosD + (maxPerp + pad) * sinD],
                                [p0 * (-sinD) + (maxPerp + pad) * cosD, p0 * cosD + (maxPerp + pad) * sinD],
                            ];

                            ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alphaBase + 0.15})`;
                            ctx.beginPath();
                            ctx.moveTo(corners[0][0], corners[0][1]);
                            ctx.lineTo(corners[1][0], corners[1][1]);
                            ctx.lineTo(corners[2][0], corners[2][1]);
                            ctx.lineTo(corners[3][0], corners[3][1]);
                            ctx.closePath();
                            ctx.fill();
                        }

                        // 쌍정 경계선 (날카로운 평행선)
                        ctx.strokeStyle = currentMode === 'xpl'
                            ? 'rgba(0, 0, 0, 0.2)'
                            : 'rgba(0, 0, 0, 0.06)';
                        ctx.lineWidth = currentMode === 'xpl' ? 0.6 : 0.3;
                        for (let bi = 1; bi < td.boundaries.length - 1; bi++) {
                            const p = minProj + td.boundaries[bi] * projRange;
                            const x1 = p * (-sinD) + (minPerp - pad) * cosD;
                            const y1 = p * cosD + (minPerp - pad) * sinD;
                            const x2 = p * (-sinD) + (maxPerp + pad) * cosD;
                            const y2 = p * cosD + (maxPerp + pad) * sinD;
                            ctx.beginPath();
                            ctx.moveTo(x1, y1);
                            ctx.lineTo(x2, y2);
                            ctx.stroke();
                        }

                        ctx.restore(); // 클리핑 해제

                    } else {
                        // 일반 그레인 (쌍정 없음)
                        tracePath();
                        const color = calculateGrainColor(grain, mineral, currentMode, stageAngle);
                        ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alphaBase})`;
                        ctx.fill();

                        // 소광 하위구역 (파동소광·얼룩소광) — XPL에서만 표현
                        if (grain.subzones && currentMode !== 'ppl') {
                            ctx.save();
                            tracePath();
                            ctx.clip();
                            // 얼룩 경계를 흐리게 (자연스러운 얼룩소광)
                            const hasBlob = grain.subzones.some(z => z.kind === 'blob');
                            if (hasBlob && typeof ctx.filter !== 'undefined') ctx.filter = 'blur(4px)';
                            for (const z of grain.subzones) {
                                const zc = calculateGrainColor(grain, mineral, currentMode, stageAngle, z.phaseOffset);
                                ctx.fillStyle = `rgba(${zc.r}, ${zc.g}, ${zc.b}, ${alphaBase})`;
                                ctx.beginPath();
                                if (z.kind === 'wedge') {
                                    ctx.moveTo(0, 0);
                                    ctx.arc(0, 0, grain.size * 2.2, z.a0, z.a1);
                                    ctx.closePath();
                                } else { // blob (얼룩)
                                    ctx.ellipse(z.x, z.y, z.rx, z.ry, 0, 0, Math.PI * 2);
                                }
                                ctx.fill();
                            }
                            ctx.filter = 'none';
                            ctx.restore();
                        }

                        // 변질(뿌연 표면) 패치 — 정장석 등
                        if (grain.alterPatches) {
                            ctx.save();
                            tracePath();
                            ctx.clip();
                            for (const p of grain.alterPatches) {
                                ctx.fillStyle = `rgba(250, 248, 240, ${p.alpha})`;
                                ctx.beginPath();
                                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                                ctx.fill();
                            }
                            ctx.restore();
                        }
                    }

                    // 외곽선 — PPL에서는 렐리프(굴절률 차)에 따라 진하기·두께 변화
                    tracePath();
                    if (currentMode === 'ppl') {
                        const rel = mineral.relief ?? 0.3;
                        ctx.strokeStyle = `rgba(35, 28, 18, ${0.12 + rel * 0.5})`;
                        ctx.lineWidth = 0.5 + rel * 1.4;
                        if (rel > 0.5) {
                            ctx.shadowColor = 'rgba(60, 50, 30, 0.35)';
                            ctx.shadowBlur = 2 + rel * 5;
                        }
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    } else {
                        ctx.strokeStyle = 'rgba(0, 0, 0, 0.18)';
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }

                    if (grain.cleavageAngles || mineral.cleavageAngles) {
                        // 벽개선은 알갱이 외곽 안쪽으로만 그린다
                        ctx.save();
                        tracePath();
                        ctx.clip();
                        drawCleavage(grain, mineral);
                        ctx.restore();
                    }

                    ctx.restore();
                });

                // 선택된 알갱이 강조 (노란 점선 외곽선) — 재물대 회전·배율 변환 안에서 다시 그림
                if (selectedGrain && grains.includes(selectedGrain)) {
                    ctx.save();
                    ctx.translate(selectedGrain.x, selectedGrain.y);
                    ctx.rotate(selectedGrain.orientation * Math.PI / 180);
                    ctx.beginPath();
                    ctx.moveTo(selectedGrain.vertices[0][0], selectedGrain.vertices[0][1]);
                    for (let si = 1; si < selectedGrain.vertices.length; si++) {
                        ctx.lineTo(selectedGrain.vertices[si][0], selectedGrain.vertices[si][1]);
                    }
                    ctx.closePath();
                    ctx.strokeStyle = isLight() ? '#d99a00' : '#ffd84d';
                    ctx.lineWidth = 2 / zoom;
                    ctx.setLineDash([6 / zoom, 4 / zoom]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.restore();
                }

                ctx.restore(); // 재물대 회전
                ctx.restore(); // 클리핑
            }

            // 원형 테두리
            ctx.beginPath();
            ctx.arc(CX, CY, RADIUS, 0, Math.PI * 2);
            ctx.strokeStyle = '#334';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 십자선
            drawCrosshair();

            updateInfoPanel(mineral, stageAngle);
            drawPolarizerDiagram();
            drawMLChart(mineral);
        }

        function drawCleavage(grain, mineral) {
            const angles = grain.cleavageAngles ?? mineral.cleavageAngles; // 그레인 단면의 벽개 우선
            if (!angles) return;
            // PPL에서는 벽개각을 읽을 수 있게 진하게, XPL은 기존 값 유지
            ctx.strokeStyle = currentMode === 'ppl' ? 'rgba(0, 0, 0, 0.22)' : 'rgba(0, 0, 0, 0.08)';
            ctx.lineWidth = currentMode === 'ppl' ? 0.6 : 0.3;

            angles.forEach(ca => {
                const caRad = ca * Math.PI / 180;
                const spacing = grain.cleavageSpacing; // 그레인 생성 시 고정된 간격
                for (let d = -grain.size; d < grain.size; d += spacing) {
                    ctx.beginPath();
                    ctx.moveTo(
                        d * Math.cos(caRad + Math.PI / 2) - grain.size * Math.cos(caRad),
                        d * Math.sin(caRad + Math.PI / 2) - grain.size * Math.sin(caRad)
                    );
                    ctx.lineTo(
                        d * Math.cos(caRad + Math.PI / 2) + grain.size * Math.cos(caRad),
                        d * Math.sin(caRad + Math.PI / 2) + grain.size * Math.sin(caRad)
                    );
                    ctx.stroke();
                }
            });
        }

        function drawCrosshair() {
            ctx.save();
            ctx.strokeStyle = currentMode === 'bertrand'
                ? 'rgba(200, 200, 255, 0.25)'
                : 'rgba(0, 0, 0, 0.3)';
            ctx.lineWidth = 1;
            ctx.setLineDash([8, 4]);

            ctx.beginPath();
            ctx.moveTo(CX - RADIUS, CY);
            ctx.lineTo(CX + RADIUS, CY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(CX, CY - RADIUS);
            ctx.lineTo(CX, CY + RADIUS);
            ctx.stroke();

            ctx.setLineDash([]);
            ctx.restore();
        }

        function drawPolarizerDiagram() {
            const dw = diagCanvas.width, dh = diagCanvas.height;
            diagCtx.clearRect(0, 0, dw, dh);
            diagCtx.fillStyle = isLight() ? '#f7f8fb' : '#12122a';
            diagCtx.fillRect(0, 0, dw, dh);

            const isXPL = (currentMode === 'xpl' || currentMode === 'bertrand');

            // 교차 중심은 항상 캔버스 정중앙
            const len = 48;
            const dcx = dw / 2;   // 130
            const dcy = dh / 2;   // 75

            // ── 화살표 그리기 헬퍼
            function drawArrow(x1, y1, x2, y2, color) {
                const angle = Math.atan2(y2 - y1, x2 - x1);
                const hw = 5, hl = 10; // 화살촉 폭/길이
                diagCtx.strokeStyle = color;
                diagCtx.fillStyle = color;
                diagCtx.lineWidth = 2.5;
                diagCtx.beginPath();
                diagCtx.moveTo(x1, y1);
                diagCtx.lineTo(x2, y2);
                diagCtx.stroke();
                // 화살촉 (채움)
                diagCtx.beginPath();
                diagCtx.moveTo(x2, y2);
                diagCtx.lineTo(x2 - hl * Math.cos(angle - 0.4), y2 - hl * Math.sin(angle - 0.4));
                diagCtx.lineTo(x2 - hl * Math.cos(angle + 0.4), y2 - hl * Math.sin(angle + 0.4));
                diagCtx.closePath();
                diagCtx.fill();
            }

            // ── 하부편광판 (E-W 수평)
            const pColor = isLight() ? '#8a6200' : '#ffcc55';
            drawArrow(dcx - len, dcy, dcx + len, dcy, pColor);
            // 라벨: 화살촉 바로 오른쪽 (좌측 정렬, 겹침 없음)
            diagCtx.fillStyle = pColor;
            diagCtx.font = '13px Malgun Gothic';
            diagCtx.textAlign = 'left';
            diagCtx.textBaseline = 'middle';
            diagCtx.fillText('편광판 (P)', dcx + len + 6, dcy);

            // ── 분석기 (N-S 수직) — XPL / Bertrand 모드만
            if (isXPL) {
                const aColor = isLight() ? '#2f5fd0' : '#88aaff';
                drawArrow(dcx, dcy + len, dcx, dcy - len, aColor);
                // 라벨: 화살촉 오른쪽, 충분히 이격
                diagCtx.fillStyle = aColor;
                diagCtx.font = '13px Malgun Gothic';
                diagCtx.textAlign = 'left';
                diagCtx.textBaseline = 'middle';
                diagCtx.fillText('분석기 (A)', dcx + 8, dcy - len);
            }

            // ── 버틀랜드 렌즈: 교차점 중심에 점선 원 (광로 삽입 표시)
            if (currentMode === 'bertrand') {
                diagCtx.strokeStyle = isLight() ? '#1d7a58' : '#77ddbb';
                diagCtx.lineWidth = 1.5;
                diagCtx.setLineDash([3, 3]);
                diagCtx.beginPath();
                diagCtx.arc(dcx, dcy, 18, 0, Math.PI * 2);
                diagCtx.stroke();
                diagCtx.setLineDash([]);
                // 라벨: 원 오른쪽, 편광판 텍스트 아래
                diagCtx.fillStyle = isLight() ? '#1d7a58' : '#77ddbb';
                diagCtx.font = '13px Malgun Gothic';
                diagCtx.textAlign = 'left';
                diagCtx.textBaseline = 'top';
                diagCtx.fillText('Bertrand lens', dcx + 22, dcy + 22);
            }

            // ── PPL 안내
            if (currentMode === 'ppl') {
                diagCtx.fillStyle = isLight() ? '#8a6200' : 'rgba(255, 210, 80, 0.9)';
                diagCtx.font = '13px Malgun Gothic';
                diagCtx.textAlign = 'center';
                diagCtx.textBaseline = 'alphabetic';
                diagCtx.fillText('분석기 제거됨', dw / 2, dh - 8);
            }

            diagCtx.textBaseline = 'alphabetic';
        }

        // ===== 미셀레비 간섭색 차트 =====
        const mlCanvas = document.getElementById('ml-chart');
        const mlCtx = mlCanvas.getContext('2d');

        // 동정 모드에서 숫자·표시를 숨길지 (D2에서 동정 모드 상태를 돌려주도록 바뀜)
        function quizHideNumbers() { return quizMode; }

        function drawMLChart(mineral) {
            const mw = mlCanvas.width; // 260
            const MAXR = 1800;         // 차트 범위 (nm)
            const bandY0 = 14, bandY1 = 44; // 색 띠 위치
            const xOf = r => r / MAXR * mw;

            mlCtx.clearRect(0, 0, mw, mlCanvas.height);

            // 간섭색 띠 — 각 열을 해당 경로차의 간섭색으로
            for (let x = 0; x < mw; x++) {
                const c = retardationToRGB(x / mw * MAXR);
                mlCtx.fillStyle = `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
                mlCtx.fillRect(x, bandY0, 1, bandY1 - bandY0);
            }

            // 차수 경계선 (550·1100·1650 nm)
            mlCtx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            mlCtx.lineWidth = 1;
            [550, 1100, 1650].forEach(r => {
                mlCtx.beginPath();
                mlCtx.moveTo(xOf(r), bandY0);
                mlCtx.lineTo(xOf(r), bandY1);
                mlCtx.stroke();
            });

            // 차수 글자 (각 구간 가운데, 띠 위)
            mlCtx.fillStyle = isLight() ? '#3b4a7a' : '#aab';
            mlCtx.font = '11px Malgun Gothic';
            mlCtx.textAlign = 'center';
            mlCtx.textBaseline = 'middle';
            mlCtx.fillText('1차', xOf(275), 9);
            mlCtx.fillText('2차', xOf(825), 9);
            mlCtx.fillText('3차', xOf(1375), 9);

            // 눈금 글자 (띠 아래)
            mlCtx.font = '11px Malgun Gothic';
            mlCtx.textBaseline = 'alphabetic';
            mlCtx.textAlign = 'left';
            mlCtx.fillText('0', 0, 56);
            mlCtx.textAlign = 'center';
            mlCtx.fillText('550', xOf(550), 56);
            mlCtx.fillText('1100', xOf(1100), 56);
            mlCtx.fillText('1650 nm', xOf(1650), 56);

            if (selectedGrain && !quizHideNumbers()) {
                // 선택한 알갱이의 경로차 위치 — 노란 삼각형 (꼭짓점이 띠 위쪽 끝)
                const gR = mineral.birefringence * selectedGrain.bireFactor * selectedGrain.thickness * 1000;
                mlCtx.fillStyle = isLight() ? '#9a6a00' : '#ffd84d';
                if (gR > MAXR) {
                    mlCtx.font = '11px Malgun Gothic';
                    mlCtx.textAlign = 'right';
                    mlCtx.textBaseline = 'alphabetic';
                    mlCtx.fillText('→ 고차', mw - 2, bandY0 - 3);
                } else {
                    const mx = xOf(gR);
                    mlCtx.beginPath();
                    mlCtx.moveTo(mx, bandY0);
                    mlCtx.lineTo(mx - 4, bandY0 - 7);
                    mlCtx.lineTo(mx + 4, bandY0 - 7);
                    mlCtx.closePath();
                    mlCtx.fill();
                }
            } else if (!quizHideNumbers()) {
                // 광물 대표 경로차(두께 30µm 기준) 위치 — 흰 점선
                const repR = mineral.birefringence * 30 * 1000;
                const mx = Math.min(xOf(repR), mw);
                mlCtx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                mlCtx.lineWidth = 1;
                mlCtx.setLineDash([3, 3]);
                mlCtx.beginPath();
                mlCtx.moveTo(mx, bandY0);
                mlCtx.lineTo(mx, bandY1);
                mlCtx.stroke();
                mlCtx.setLineDash([]);
            }
        }

        // ===== 관찰 설명 카드 (G12·G13 → G15): 카드 세 장 =====
        const OBS_EVENT_HTML = '선택한 알갱이가 검게 변했다. 이것을 <b>소광</b>이라고 한다. 알갱이 속을 지나는 빛의 <b>진동 방향이 십자선(편광판·분석기의 방향)과 나란해지면</b>, 빛이 분석기를 지나지 못해 검게 보인다.';
        const OBS_CARDS = [['event', 'card-event', 'obs-event-body'], ['mineral', 'card-mineral', 'obs-mineral-body'], ['screen', 'card-screen', 'obs-screen-body']];
        let obsKey = null, obsShown = false, obsPrevBright = null, obsPrevGrain = null, obsPrevEff = null;
        const obsCardSig = {};
        // 그 카드만 0.6초 테두리 강조
        function flashObsCard(el) {
            if (!el) return;
            el.classList.remove('obs-flash');
            void el.offsetWidth;
            el.classList.add('obs-flash');
            clearTimeout(el._obsFlashTimer);
            el._obsFlashTimer = setTimeout(() => el.classList.remove('obs-flash'), 700);
        }
        function updateObsCard(mineral, stageAngle) {
            const evCard = document.getElementById('card-event');
            const ev = document.getElementById('obs-event-body');
            const key = mineral.id + '|' + currentMode + '|' + (quizMode ? 'q' : '');
            if (key !== obsKey) { obsKey = key; obsShown = false; obsPrevBright = null; obsPrevEff = null; }
            // 현재 밝기 (XPL·보상기 없음·선택 알갱이·등방성 제외)
            let pct = null, effDeg = null;
            if (currentMode === 'xpl' && selectedGrain && getCompensatorR() <= 0 && mineral.opticType !== 'isotropic') {
                const g = selectedGrain;
                const effA = (g.orientation + stageAngle - (g.extAngle ?? mineral.extinctionAngle)) * Math.PI / 180;
                effDeg = effA * 180 / Math.PI;
                pct = Math.round(Math.sin(2 * effA) ** 2 * 100);
            }
            if (selectedGrain !== obsPrevGrain) { obsPrevGrain = selectedGrain; obsPrevBright = null; obsPrevEff = null; }
            if (pct !== null) {
                if (!obsShown && obsPrevBright !== null && obsPrevBright > 3 && pct <= 3) obsShown = true;
                // 빠르게 돌려 소광 위치(90°의 정수배)를 지나쳤는지: 짧은 쪽 각도 차, 90° 이상 점프는 제외
                if (!obsShown && obsPrevEff !== null) {
                    const d = ((effDeg - obsPrevEff + 540) % 360 + 360) % 360 - 180;
                    if (Math.abs(d) < 90 && Math.floor(obsPrevEff / 90) !== Math.floor((obsPrevEff + d) / 90)) obsShown = true;
                }
                obsPrevBright = pct;
                obsPrevEff = effDeg;
            } else {
                obsPrevBright = null;
                obsPrevEff = null;
            }
            if (obsShown) { ev.innerHTML = OBS_EVENT_HTML; evCard.style.display = 'block'; }
            else { ev.innerHTML = ''; evCard.style.display = 'none'; }
            // 카드별로 내용(제목+본문)이 바뀌면 그 카드만 강조
            OBS_CARDS.forEach(([key, cardId, bodyId]) => {
                const el = document.getElementById(cardId);
                const sig = el.querySelector('.obs-card-title').textContent + '||' + document.getElementById(bodyId).innerHTML;
                if (obsCardSig[key] !== undefined && sig !== obsCardSig[key]) flashObsCard(el);
                obsCardSig[key] = sig;
            });
        }

        function updateInfoPanel(mineral, stageAngle) {
            const modeBadge = document.getElementById('mode-badge');
            const obsMode = document.getElementById('obs-mode');

            modeBadge.setAttribute('data-term', currentMode === 'bertrand' ? 'cono' : 'ortho');
            if (currentMode === 'ppl') {
                obsMode.textContent = '개방니콜 (PPL)';
                modeBadge.textContent = 'PPL — 오소스코프';
                modeBadge.className = 'badge-ppl';
            } else if (currentMode === 'xpl') {
                obsMode.textContent = '직교니콜 (XPL)';
                modeBadge.textContent = 'XPL — 오소스코프';
                modeBadge.className = 'badge-xpl';
            } else {
                obsMode.textContent = '직교니콜 + 버틀랜드 렌즈';
                modeBadge.textContent = 'XPL — 코노스코프';
                modeBadge.className = 'badge-bertrand';
            }

            document.getElementById('info-name').textContent = mineral.name;
            document.getElementById('info-optic').textContent =
                mineral.opticType === 'isotropic'
                    ? '등방성 (등축계)'
                    : mineral.opticType === 'uniaxial'
                        ? `일축성 (${mineral.opticSign})`
                        : `이축성 (${mineral.opticSign}), 2V=${mineral.twoV}°`;
            document.getElementById('info-bire').textContent = mineral.birefringence.toFixed(3);
            document.getElementById('info-ext').textContent = mineral.extinctionDesc || '-';

            const retardation = mineral.birefringence * 30 * 1000;
            document.getElementById('info-retard').textContent = `${Math.round(retardation)} nm`;
            document.getElementById('info-order').textContent =
                mineral.opticType === 'isotropic' ? '해당 없음' : getInterferenceOrder(retardation);
            document.getElementById('info-pleo').textContent = mineral.pleochroismDesc;

            const swatch = document.getElementById('color-swatch');
            if (currentMode === 'ppl') {
                const stageRad = stageAngle * Math.PI / 180;
                const f = Math.cos(stageRad) * Math.cos(stageRad);
                const pr = Math.round(mineral.colorA[0] * f + mineral.colorB[0] * (1 - f));
                const pg = Math.round(mineral.colorA[1] * f + mineral.colorB[1] * (1 - f));
                const pb = Math.round(mineral.colorA[2] * f + mineral.colorB[2] * (1 - f));
                swatch.style.background = `rgb(${pr}, ${pg}, ${pb})`;
            } else {
                const rgb = retardationToRGB(retardation);
                swatch.style.background = `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
            }

            document.getElementById('card-mineral-title').textContent = mineral.name.split('(')[0].trim();
            document.getElementById('obs-mineral-body').innerHTML = (LITE && mineral.simple) ? mineral.simple : mineral.description;

            // 동정 모드: 광물 정보를 가리고 관찰로 판단하게 한다
            const swatchEl = document.getElementById('color-swatch');
            if (quizMode) {
                document.getElementById('info-name').textContent = '시료 ' + (mineralSelect.selectedIndex + 1);
                document.getElementById('card-mineral-title').textContent = mineralSelect.options[mineralSelect.selectedIndex].textContent;
                ['info-optic', 'info-bire', 'info-retard', 'info-order', 'info-ext', 'info-pleo']
                    .forEach(id => { document.getElementById(id).textContent = '관찰로 판단'; });
                swatchEl.style.display = 'none';
                document.getElementById('obs-mineral-body').textContent =
                    '개방니콜(PPL)에서 색·다색성·벽개·렐리프·변질을, 직교니콜(XPL)에서 간섭색·소광·쌍정을 관찰하여 광물 이름을 판정하시오.';
            } else {
                swatchEl.style.display = '';
            }

            // 지금 보이는 것 해설
            {
                const compSel = document.getElementById('comp-select').value;
                const iso = mineral.opticType === 'isotropic' && !quizMode;
                // 카드 제목 = 지금 관찰 방법
                const screenTitle = currentMode === 'ppl' ? '개방 니콜(PPL)로 볼 때'
                    : currentMode === 'bertrand' ? '코노스코프(Bertrand)로 볼 때'
                        : compSel === 'none' ? '직교 니콜(XPL)로 볼 때' : '직교 니콜 + 보상기';
                document.getElementById('card-screen-title').textContent = screenTitle;
                let t;
                if (currentMode === 'ppl') {
                    t = '개방니콜: 분석기를 빼서 편광판 하나만 지난 빛을 봅니다. 보이는 색은 광물 고유의 색이고, 재물대를 돌릴 때 색이 바뀌면 다색성입니다. 윤곽이 뚜렷할수록 렐리프가 높습니다.';
                } else if (currentMode === 'xpl') {
                    if (compSel === 'gypsum') {
                        t = '집시판(530nm)을 넣으면 광물이 없는 곳이 1차 적자색이 됩니다. 광물의 느린 방향이 집시판의 느린 방향(북동-남서)과 나란하면 경로차가 더해져 청색 쪽으로, 수직이면 빼져 황색 쪽으로 바뀝니다. 소광 위치의 알갱이는 배경과 같은 적자색입니다.';
                    } else if (compSel === 'quarter') {
                        t = 'λ/4판(137nm)을 넣으면 배경이 1차 회색이 됩니다. 집시판과 같은 원리로 경로차가 더해지거나 빼지며, 간섭색이 높은 광물의 부호 판정에 씁니다.';
                    } else if (compSel === 'wedge') {
                        t = '석영 쐐기를 밀어 넣을수록 경로차가 연속으로 더해져 배경 간섭색이 1차→2차→3차로 올라갑니다. 광물과 감산 방향일 때 광물이 검게 되는 삽입량으로 광물의 경로차를 잴 수 있습니다.';
                    } else {
                        t = '직교니콜: 편광판과 분석기가 직교해 광물이 없으면 검게 보입니다. 광물 안에서 두 빛으로 갈라진 빛의 경로차가 간섭색을 만들고, 진동 방향이 십자선과 나란해지면 어두워집니다(소광).';
                        if (iso) t += '<br>이 광물은 등방성이라 빛이 갈라지지 않아 재물대를 돌려도 항상 검습니다.';
                    }
                } else {
                    t = '코노스코프: 버틀랜드 렌즈로 수렴광이 만든 간섭상을 봅니다. 일축성은 검은 십자가 재물대를 돌려도 움직이지 않고, 이축성은 0°에서 십자였다가 45°로 돌리면 두 곡선(쌍곡선)으로 갈라집니다.';
                    if (compSel === 'gypsum') t += '<br>보상기를 넣으면 일축성 (+)는 1·3사분면(북동·남서)이 청색, (−)는 황색이 됩니다.';
                    else if (compSel === 'quarter') t += '<br>λ/4판을 넣으면 일축성 (+)는 2·4사분면(북서·남동)의 중심 가까이에 검은 점이 생기고, (−)는 1·3사분면에 생깁니다.';
                    if (iso) t += '<br>등방성 광물은 간섭상이 생기지 않습니다.';
                }
                // 카드 제목과 겹치는 머리말(개방니콜: / 직교니콜: / 코노스코프: )만 뗀다
                t = t.replace(/^(개방니콜|직교니콜|코노스코프):\s*/, '');
                document.getElementById('obs-screen-body').innerHTML = t;
            }
            updateObsCard(mineral, stageAngle);

            // 선택 그레인이 바뀌면 소광각 측정 기록 초기화
            if (selectedGrain !== lastSelForMeasure) {
                lastSelForMeasure = selectedGrain;
                extMeasure = { a1: null, a2: null };
            }

            // 선택한 알갱이 정보
            const gi = document.getElementById('grain-info');
            if (!selectedGrain) {
                gi.innerHTML = '<div style="font-size:13px;color:#8899aa">시야의 알갱이를 클릭하면 정보가 나타납니다.</div>';
            } else {
                const g = selectedGrain;
                const gR = mineral.birefringence * g.bireFactor * g.thickness * 1000; // 이 알갱이의 경로차 (nm)
                let rows = '';
                if (!LITE && g.section && !quizMode) { // 동정 모드에서는 '단면' 줄 자체를 숨김 (줄 유무가 힌트가 됨)
                    rows += grainInfoRow('단면', g.section === 'long' ? '세로 단면 (벽개 1방향)' : '기저 단면 (벽개 2방향)', true);
                }
                if (!LITE) {
                    rows += grainInfoRow('경로차', Math.round(gR) + ' nm', true);
                    rows += grainInfoRow('간섭색 차수',
                        mineral.opticType === 'isotropic' ? '해당 없음' : getInterferenceOrder(gR), true);
                }
                // 현재 밝기 — XPL에서는 sin²(2θ) (calculateGrainColor와 같은 식)
                let bright;
                if (currentMode === 'ppl') {
                    bright = '— (개방니콜)';
                } else if (getCompensatorR() > 0) {
                    bright = '보상기 삽입 중';
                } else if (mineral.opticType === 'isotropic') {
                    bright = '0% (완전 소광)';
                } else {
                    const effA = (g.orientation + stageAngle - (g.extAngle ?? mineral.extinctionAngle)) * Math.PI / 180;
                    const pct = Math.round(Math.sin(2 * effA) ** 2 * 100);
                    bright = pct + '%' + (pct <= 3 ? ' (소광)' : '');
                }
                rows += grainInfoRow('현재 밝기', bright);
                rows += extMeasureBoxHTML();
                gi.innerHTML = rows;
            }
        }

        // 선택한 알갱이 정보 행 생성 — hideInQuiz 행은 D2 동정 모드에서 숨길 수 있게 표시
        function grainInfoRow(label, value, hideInQuiz) {
            if (hideInQuiz && quizMode) value = '관찰로 판단';
            const GI_TERM = { '단면': 'section', '경로차': 'retard', '간섭색 차수': 'order', '현재 밝기': 'brightness' };
            const termAttr = GI_TERM[label] ? ` data-term="${GI_TERM[label]}"` : '';
            return `<div class="info-row"${hideInQuiz ? ' data-quiz-hide="1"' : ''}>`
                + `<span class="info-label"${termAttr}>${label}</span>`
                + `<span class="info-value">${value}</span></div>`;
        }

        // 소광각 측정 상자 (XPL·보상기 없음일 때만)
        function extMeasureBoxHTML() {
            if (LITE) return '';
            if (currentMode !== 'xpl' || getCompensatorR() > 0) {
                return '<div style="font-size:13.5px;color:#8899aa;margin-top:8px"><span data-term="extangle">소광각</span> 측정은 XPL(보상기 없음)에서 할 수 있습니다.</div>';
            }
            const btnStyle = 'padding:6px 10px;font-size:14px';
            const v = x => (x === null ? '-' : x + '°');
            let h = '<div style="margin-top:10px">'
                + '<div style="font-size:13.5px;color:#8899aa">※ 벽개가 한 방향으로만 보이는 길쭉한 알갱이에서 잽니다.</div>'
                + '<div style="font-size:13.5px;color:#8899aa">1) 벽개선이 십자선과 나란하도록 재물대를 돌린 뒤 ①을 누릅니다.</div>'
                + '<div style="font-size:13.5px;color:#8899aa">2) 알갱이가 가장 어두워질 때까지 돌린 뒤 ②를 누릅니다.</div>'
                + '<div style="margin:6px 0"><button class="mode-btn" style="' + btnStyle + '" data-act="ext-a1">① 기준 각도 기록</button> '
                + '<button class="mode-btn" style="' + btnStyle + '" data-act="ext-a2">② 소광 각도 기록</button></div>'
                + '<div class="info-row"><span class="info-label">기준 각도</span><span class="info-value">' + v(extMeasure.a1) + '</span></div>'

        // 측정 버튼 — 이벤트 위임 (innerHTML이 다시 써져도 동작)

        let lastPDAct = null, lastPDTime = 0;

        // ===== 동정 모드 =====
        function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
        function quizOrder(set) { const rnd = mulberry32(set * 7919 + 13); const arr = QUIZ_IDS.slice(); for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
        const QUIZ_DEFAULT_SET = 1; // 학습지에 인쇄한 세트 — 반 전체 공통

        // 교사용 정답 상자 — teacher=1 해시일 때만 DOM에 만든다

        // ===== 알갱이 클릭 선택 =====
        // 광선 교차법으로 다각형 안쪽 판정
        function pointInPolygon(px, py, verts) {
            let inside = false;
            for (let i = 0, j = verts.length - 1; i < verts.length; j = i++) {
                const xi = verts[i][0], yi = verts[i][1];
                const xj = verts[j][0], yj = verts[j][1];
                if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
            }
            return inside;
        }

        canvas.addEventListener('click', (e) => {
            if (currentMode === 'bertrand') return; // 코노스코프 화면에서는 선택 안 함
            // 화면 좌표 → 캔버스 좌표
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * canvas.width / rect.width;
            const y = (e.clientY - rect.top) * canvas.height / rect.height;
            if (Math.hypot(x - CX, y - CY) > RADIUS) return; // 시야 원 밖 무시

            // 배율·재물대 회전을 되돌려 박편 좌표로
            const zoom = parseInt(document.getElementById('obj-select').value) / 10;
            const s = parseFloat(stageSlider.value) * Math.PI / 180;
            const dx = (x - CX) / zoom, dy = (y - CY) / zoom;
            const tx = dx * Math.cos(s) + dy * Math.sin(s) + CX;
            const ty = -dx * Math.sin(s) + dy * Math.cos(s) + CY;

            // 위에 그려진 것부터(배열 뒤에서부터) 안쪽 판정
            selectedGrain = null;
            for (let i = grains.length - 1; i >= 0; i--) {
                const g = grains[i];
                // 박편 좌표 → 그레인 국소 좌표 (위치 이동 후 -orientation 회전)
                const o = g.orientation * Math.PI / 180;
                const ux = tx - g.x, uy = ty - g.y;
                const lx = ux * Math.cos(o) + uy * Math.sin(o);
                const ly = -ux * Math.sin(o) + uy * Math.cos(o);
                if (pointInPolygon(lx, ly, g.vertices)) { selectedGrain = g; break; }
            }
            render();
        });

        // ===== 초기화 =====

        {

        // ===== 학습지 활동 안내판 (G2) =====

        const ACT_GUIDE = {

        const ACT_FLASH = {

        const ACT_MODE = { 1: 'xpl', 2: 'ppl', 3: 'xpl' };

        // 구조 탭 깜박임과 같은 방식: 노란 테두리 0.5초 간격, 2.5초 후 사라짐
        function flashGuide(id) {

        // 공통 초기 상태: 대물렌즈 10×, 보상기 없음, 조명 100%, 자동 회전 끔, 재물대 0°

        {

        // ===== 용어 풀이 말풍선 + 용어 정리 창 (G3) =====
        // 보상기 select는 option에 툴팁을 못 붙이므로 현재 선택값으로 풀이 키를 정한다
        const COMP_TERM = { none: 'compensator', gypsum: 'gypsum', quarter: 'quarter', wedge: 'wedge' };
        document.getElementById('comp-select').addEventListener('change', function () {
            this.setAttribute('data-term', COMP_TERM[this.value] || 'compensator');
        });
        function termKeysOf(el) {
            return (el.getAttribute('data-term') || '').split(/\s+/).filter(k => TERMS[k]);
        }
        function termTipHTML(el) {
            return termKeysOf(el).map((k, i) =>
                '<div' + (i ? ' class="tt-sep"' : '') + '><b>' + TERMS[k].name + '</b><br>' + TERMS[k].desc + '</div>').join('');
        }
        (function () {
            const tip = document.getElementById('term-tip');
            let cur = null, timer = null, mx = 0, my = 0;
            function hideTip() { clearTimeout(timer); timer = null; tip.style.display = 'none'; cur = null; }
            function showTip(el) {
                if (!el || !el.isConnected) return;
                const html = termTipHTML(el);
                if (!html) return;
                tip.innerHTML = html;
                tip.style.left = '8px'; tip.style.top = '8px';
                tip.style.display = 'block';
                const r = tip.getBoundingClientRect();
                let x = mx + 14, y = my + 18;
                if (x + r.width > window.innerWidth - 8) x = window.innerWidth - r.width - 8;
                if (y + r.height > window.innerHeight - 8) y = my - r.height - 12;
                tip.style.left = Math.max(8, x) + 'px';
                tip.style.top = Math.max(8, y) + 'px';
            }
            function termOf(t) { return (t && t.closest) ? t.closest('[data-term]') : null; }
            document.addEventListener('mouseover', (e) => {
                const el = termOf(e.target);
                mx = e.clientX; my = e.clientY;
                if (!el) { if (cur) hideTip(); return; }
                if (el === cur) return;
                hideTip(); cur = el;
                timer = setTimeout(() => showTip(el), 250);
            });
            document.addEventListener('mouseout', (e) => {
                if (!cur) return;
                const to = e.relatedTarget;
                if (to && cur.contains(to)) return;
                hideTip();
            });
            document.addEventListener('mousemove', (e) => {
                mx = e.clientX; my = e.clientY;
                if (cur && tip.style.display === 'block' && !cur.isConnected) hideTip();
            });
            document.addEventListener('focusin', (e) => {
                const el = termOf(e.target);
                if (!el) return;
                const r = el.getBoundingClientRect();
                mx = r.left; my = r.bottom - 14;
                hideTip(); cur = el; showTip(el);
            });
            document.addEventListener('focusout', () => { if (cur) hideTip(); });
