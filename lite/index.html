                ctx.save();
                for (const sg of segs) {
                    ctx.strokeStyle = sg.major ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.65)';
                    ctx.lineWidth = sg.major ? 1.6 : 1;
                    ctx.beginPath(); ctx.moveTo(sg.a[0], sg.a[1]); ctx.lineTo(sg.b[0], sg.b[1]); ctx.stroke();
                }
                ctx.restore();
            });
        }
        // 5 박편 (유리판 + 가운데 회색 시료)
        Y = 41 + sh(5);
        addBox('slide', [0, Y + 0.5, 0], [22, 1, 8], 0, [172, 216, 232], { layer: 5, alpha: 0.6 });
        addCyl('slide', [0, Y + 1, 0], UP, 0.5, 2.4, [135, 130, 125], { layer: 5.1, cap: [165, 160, 152] });
        // 6 대물렌즈 3개 + 회전판(노즈피스)
        Y = 56 + sh(6);
        {
            const objs = [
                { c: [0, Y, 0], d: [0, -1, 0], len: 12, r: 3.6, ring: [70, 110, 235] },
                { c: [-7, Y, 3], d: [-0.4, -1, 0.25], len: 9.5, r: 3, ring: [235, 200, 60] },
                { c: [7, Y, 3], d: [0.4, -1, 0.25], len: 7.5, r: 2.6, ring: [225, 70, 60] }
            ];
            for (const ob of objs) {
                const d = norm(ob.d);
                addCyl('objective', ob.c, d, ob.len, ob.r, [64, 68, 84], { layer: 6 });
                const sc = [ob.c[0] + d[0] * ob.len * 0.45, ob.c[1] + d[1] * ob.len * 0.45, ob.c[2] + d[2] * ob.len * 0.45];
                addCyl('objective', sc, d, 1.6, ob.r + 0.12, ob.ring, { layer: 6, zoff: 0.01, decor: true });
            }
            addCyl('objective', [0, Y, 0], UP, 4.5, 13, [98, 103, 122], { layer: 6.1, cap: [128, 133, 152] });
        }
        // 7 보상기 슬롯: 경통 + 45° 홈 + 꽂힌 판
        Y = 64 + sh(7);
        addCyl('slot', [0, Y, 0], UP, 9, 8, [90, 94, 110], { layer: 7, cap: [112, 116, 132] });
        {
            const d = [Math.SQRT1_2, 0, Math.SQRT1_2];
            const gc = [d[0] * 7.4, Y + 4.5, d[2] * 7.4], pc = [d[0] * 12.5, Y + 4.5, d[2] * 12.5];
            addBox('slot', gc, [4, 2.4, 7.5], -45, [14, 14, 22], { layer: 7.1 });
            addBox('slot', pc, [16, 1, 6.5], -45, [206, 190, 118], { layer: layerBy(7, pc) });
        }
        // 8 분석기: 밀고 당기는 슬라이더 + 파란 테 원판 + 손잡이
        Y = 74 + sh(8);
        addBox('analyzer', [0, Y + 1, 5.5], [17, 2, 29], 0, [102, 108, 128], { layer: 8 });
        addCyl('analyzer', [0, Y + 2, 0], UP, 0.8, 7, [96, 134, 232], { layer: 8.05, cap: [96, 134, 232] });
        addCyl('analyzer', [0, Y + 2.8, 0], UP, 0.1, 5.6, [30, 38, 80], { layer: 8.1, cap: [30, 38, 80], decor: true });
        addCyl('analyzer', [0, Y + 1, 20], [0, 0, 1], 5, 2.4, MET, { layer: 8.2 });
        // 9 버틀랜드 렌즈 + 손잡이
        Y = 78 + sh(9);
        addCyl('bertrand', [0, Y, 0], UP, 7, 7.5, [94, 100, 118], { layer: 9, cap: [120, 126, 144] });
        {
            const q = [-7, Y + 3.5, 0], q2 = [-18, Y + 3.5, 0], qm = [-12, Y + 3.5, 0];
            addCyl('bertrand', q, [-1, 0, 0], 11, 1.5, MET, { layer: layerBy(9, qm) });
            addCyl('bertrand', q2, [-1, 0, 0], 3, 2.3, DARK, { layer: layerBy(9, qm) });
        }
        // 10 접안렌즈 (위쪽 고무 테)
        Y = 85 + sh(10);
        addCyl('eyepiece', [0, Y, 0], UP, 15, 6, [60, 62, 76], { layer: 10 });
        addCyl('eyepiece', [0, Y + 15, 0], UP, 4, 7.6, [32, 32, 38], { layer: 10.1, cap: [46, 46, 54] });
        addCyl('eyepiece', [0, Y + 19, 0], UP, 0.1, 4.6, [22, 28, 50], { layer: 10.2, cap: [22, 28, 50], decor: true });
    }

    function updateView() {
        view.s = 5.3 + (3.8 - 5.3) * expl;
        view.cx = 235;
        view.cy = 340 + (52 + expl * 25) * CP * view.s;
    }

    // ----- 빛의 경로·진동 방향 화살표 -----
    function head(p, ang, color) {
        ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(p[0], p[1]);
        ctx.lineTo(p[0] - 7 * Math.cos(ang - 0.45), p[1] - 7 * Math.sin(ang - 0.45));
        ctx.lineTo(p[0] - 7 * Math.cos(ang + 0.45), p[1] - 7 * Math.sin(ang + 0.45));
        ctx.closePath(); ctx.fill();
    }
    function dbl(p1, p2, color) {
        const a = proj(p1), b = proj(p2), ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
        ctx.strokeStyle = color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
        head(b, ang, color); head(a, ang + Math.PI, color);
    }
    function drawLight() {
        const A = proj([0, 13 + sh(0), 0]), B = proj([0, 104 + sh(10), 0]);
        ctx.save();
        ctx.lineCap = 'round';
        const LT = isLight();
        ctx.strokeStyle = LT ? 'rgba(201,138,0,0.16)' : 'rgba(255,226,90,0.14)'; ctx.lineWidth = 9;
        ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
        ctx.setLineDash([9, 7]); ctx.lineDashOffset = -dash;
        ctx.strokeStyle = LT ? 'rgba(201,138,0,0.85)' : 'rgba(255,226,90,0.75)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
        ctx.setLineDash([]);
        head([B[0], B[1] - 12], -Math.PI / 2, LT ? '#c98a00' : 'rgba(255,226,90,0.9)');
        // 하부 편광판 위: 동-서 진동(노랑), 분석기 위: 남-북 진동(파랑)
        const gy = (topI, topY, botI, botY) => (topY + sh(topI) + botY + sh(botI)) / 2;
        // 박편 위는 빛이 두 방향으로 갈라지므로 동-서 화살표를 그리지 않음
        const ew = [gy(1, 17.5, 2, 20), gy(3, 34.2, 4, 38)];
        const ns = [gy(8, 76.8, 9, 78), gy(9, 85, 10, 85)];
        ew.forEach(y => dbl([-8, y, 0], [8, y, 0], LT ? '#c98a00' : '#ffd84d'));
        ns.forEach(y => dbl([0, y, -8], [0, y, 8], LT ? '#2f5fd0' : '#88aaff'));
        ctx.restore();
        ctx.save();
        const lfs = lblFs();
        ctx.font = lfs + "px 'Malgun Gothic', sans-serif"; ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = LT ? '#8a6200' : '#ffd84d'; ctx.fillText('노랑 화살표: 동-서 진동', 14, 8 + lfs);
        ctx.fillStyle = LT ? '#2f5fd0' : '#88aaff'; ctx.fillText('파랑 화살표: 남-북 진동', 14, 8 + lfs + (lfs > 13.01 ? lfs * 1.3 : 16));
        ctx.restore();
    }

    // ----- 이름표 -----
    function anchorOf(p) {
        const sil = (r, y) => [r * Math.cos(yaw), y, r * Math.sin(yaw)];   // 화면 오른쪽 윤곽 점
        switch (p.id) {
            case 'lamp': return sil(6, 11 + sh(0));
            case 'polarizer': return sil(11, 16.8 + sh(1));
            case 'iris': return sil(11, 20.8 + sh(2));
            case 'condenser': return sil(9, 28.5 + sh(3));
            case 'stage': return sil(19, 39.5 + sh(4));
            case 'slide': return sil(9, 41.5 + sh(5));
            case 'objective': return sil(13, 58 + sh(6));
            case 'slot': return sil(8, 66 + sh(7));
            case 'analyzer': return sil(8.5, 75 + sh(8));
            case 'bertrand': return sil(7.5, 81.5 + sh(9));
            case 'eyepiece': return sil(6, 92 + sh(10));
            case 'focus': return [11, 38, -27];
            case 'dimmer': return [39.5, 4.5, 14];
            default: return [36, 4, -8];
        }
    }
    // 캔버스가 화면에서 줄어 보일 때(휴대폰) 글자를 그만큼 키워 실제 화면에서 13px 이상으로 보이게 함
    function lblFs() {
        const cw = cv.clientWidth;
        if (!cw || cw >= W) return 13;
        return Math.min(24, 13 * W / cw);
    }
    function drawLabels() {
        const list = PARTS.map(p => ({ p: p, pt: proj(anchorOf(p)) })).sort((a, b) => a.pt[1] - b.pt[1]);
        const n = list.length, y0 = 34, y1 = H - 54;
        const fs = lblFs(), big = fs > 13.01;
        ctx.save();
        ctx.font = fs + "px 'Malgun Gothic', sans-serif"; ctx.textBaseline = 'middle';
        const LT = isLight();
        let LXd = LX;
        if (big) {
            let mw = 0;
            list.forEach(it => { mw = Math.max(mw, ctx.measureText(it.p.name).width); });
            LXd = Math.min(LX, W - 8 - mw);
        }
        const hh = big ? fs * 1.4 : 18;
        labelHits = [];
        list.forEach((it, i) => {
            const ly = y0 + i * (y1 - y0) / (n - 1), on = (sel === it.p.id || hover === it.p.id);
            const tw = ctx.measureText(it.p.name).width;
            labelHits.push({ id: it.p.id, x: LXd - 4, y: ly - hh / 2, w: tw + 8, h: hh });
            if (labelHover === it.p.id) {
                ctx.fillStyle = LT ? 'rgba(217,154,0,0.18)' : 'rgba(255,216,77,0.15)';
                ctx.fillRect(LXd - 4, ly - hh / 2, tw + 8, hh);
            }
            ctx.strokeStyle = on ? (LT ? '#d99a00' : 'rgba(255,216,77,0.9)') : (LT ? 'rgba(59,74,122,0.5)' : 'rgba(136,153,204,0.5)');
            ctx.lineWidth = on ? 1.4 : 1;
            ctx.beginPath(); ctx.moveTo(it.pt[0], it.pt[1]); ctx.lineTo(LXd - 30, ly); ctx.lineTo(LXd - 6, ly); ctx.stroke();
            ctx.fillStyle = on ? (LT ? '#d99a00' : '#ffd84d') : (LT ? '#3b4a7a' : '#99a8d8');
            ctx.beginPath(); ctx.arc(it.pt[0], it.pt[1], 2.2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = on ? (LT ? '#8a6200' : '#ffd84d') : (LT ? '#3b4a7a' : '#c8cce0');
            ctx.fillText(it.p.name, LXd, ly);
        });
        ctx.restore();
    }

    // ----- 한 장면 그리기 -----
    function draw() {
        updateView();
        build();
        prims.sort((a, b) => a.layer - b.layer || a.z - b.z);
        ctx.clearRect(0, 0, W, H);
        for (const p of prims) p.draw();
        if (showLight) drawLight();
        // 마우스를 올린 부품·선택한 부품 테두리
        const marks = [];
        if (hover) marks.push(hover);
        if (sel && sel !== hover) marks.push(sel);
        ctx.save(); ctx.strokeStyle = isLight() ? '#d99a00' : '#ffd84d'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
        for (const id of marks) for (const p of prims) if (p.part === id && p.poly) strokePoly(p.poly);
        ctx.restore();
        drawLabels();
    }
    function labelAt(x, y) {
        for (const h of labelHits) if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h.id;
        return null;
    }
    function pickAt(x, y) {
        for (let i = prims.length - 1; i >= 0; i--) {
            const p = prims[i];
            if (p.poly && ptIn(x, y, p.poly)) return p.part;
        }
        return null;
    }

    // ----- 애니메이션 루프 -----
    function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function loop() {
        if (!visible) { looping = false; return; }
        const now = performance.now();
        if (explAnim) {
            const t = Math.min(1, (now - explAnim.t0) / explAnim.dur);
            expl = explAnim.from + (explAnim.to - explAnim.from) * ease(t);
            if (t >= 1) explAnim = null;
        }
        if (yawAnim) {
            const t = Math.min(1, (now - yawAnim.t0) / yawAnim.dur);
            yaw = yawAnim.from + (yawAnim.to - yawAnim.from) * ease(t);
            if (t >= 1) yawAnim = null;
        }
        if (showLight) dash += 0.5;
        draw();
        if (showLight || explAnim || yawAnim) requestAnimationFrame(loop); else looping = false;
    }
    function kick() { if (visible && !looping) { looping = true; requestAnimationFrame(loop); } }
    function redraw() { if (visible && !looping) draw(); }
    window.__scopeRedraw = function () { if (visible) draw(); };

    // ----- 오른쪽 설명 패널 -----
    function flash(id) {
        const el = document.getElementById(id);
        if (!el) return;
        try { el.scrollIntoView({ block: 'nearest' }); } catch (e) { }
        let n = 0;
        const iv = setInterval(() => {
            n++;
            el.style.outline = (n % 2) ? '3px solid ' + (isLight() ? '#d99a00' : '#ffd84d') : 'none';
            el.style.outlineOffset = '2px';
            if (n >= 8) { clearInterval(iv); el.style.outline = ''; el.style.outlineOffset = ''; }
        }, 250);
    }
    function renderPanel() {
        const el = document.getElementById('part-panel');
        el.innerHTML = '';
        const h = document.createElement('h3');
        if (!sel) {
            h.textContent = '현미경 구조';
            const p = document.createElement('p');
            p.textContent = '편광현미경은 일반 광학현미경에 편광판 두 장(하부 편광판·분석기)과 재물대 회전, 보상기, 버틀랜드 렌즈를 더한 현미경입니다. 부품을 클릭해 보세요.';
            el.append(h, p);
            const box = document.createElement('div');
            PARTS.slice().reverse().forEach(pt => {
                const a = document.createElement('span');
                a.className = 'pp-item'; a.textContent = pt.name; a.dataset.id = pt.id;
                a.addEventListener('click', () => selectPart(pt.id));
                box.appendChild(a);
            });
            el.appendChild(box);
            return;
        }
        const pt = byId[sel];
        h.textContent = pt.name;
        const p = document.createElement('p');
        p.textContent = pt.desc;
        el.append(h, p, document.createElement('hr'));
        if (pt.sim !== '—') {
            const s = document.createElement('div');
            s.className = 'pp-sim';
            s.textContent = '시뮬레이션에서는: ' + pt.sim;
            el.appendChild(s);
        }
        if (pt.ctl) {
            const b = document.createElement('button');
            b.className = 'mode-btn'; b.id = 'btn-try-obs'; b.textContent = '박편 관찰에서 해 보기';
            b.addEventListener('click', () => { showTab('obs'); flash(pt.ctl); });
            el.appendChild(b);
        }
        const back = document.createElement('div');
        back.style.marginTop = '12px';
        const bl = document.createElement('span');
        bl.className = 'pp-item'; bl.id = 'pp-back'; bl.textContent = '부품 목록으로';
        bl.addEventListener('click', () => selectPart(null));
        back.appendChild(bl);
        el.appendChild(back);
    }
    function selectPart(id) { sel = id; renderPanel(); redraw(); }

    // ----- 탭 전환 -----
    function showTab(name) {
        const st = (name === 'struct');
        document.getElementById('view-obs').style.display = st ? 'none' : 'flex';
        document.getElementById('view-struct').style.display = st ? 'flex' : 'none';
        document.getElementById('tab-obs').className = 'mode-btn' + (st ? '' : ' active-xpl');
        document.getElementById('tab-struct').className = 'mode-btn' + (st ? ' active-xpl' : '');
        if (st) {
            // 자동 회전 중이면 끈다
            if (typeof autoRotate !== 'undefined' && autoRotate) document.getElementById('btn-rotate').click();
            visible = true; draw(); kick();
        } else {
            visible = false;
        }
    }
    document.getElementById('tab-obs').addEventListener('click', () => showTab('obs'));
    document.getElementById('tab-struct').addEventListener('click', () => showTab('struct'));

    // ----- 위쪽 버튼 -----
    function setExplodeLabel(to) { document.getElementById('btn-explode').textContent = to ? '조립도' : '분해도'; }
    document.getElementById('btn-explode').addEventListener('click', () => {
        const to = (expl > 0.5 && !(explAnim && explAnim.to === 0)) ? 0 : 1;
        explAnim = { from: expl, to: to, t0: performance.now(), dur: 400 };
        setExplodeLabel(to); kick();
    });
    document.getElementById('btn-lightpath').addEventListener('click', function () {
        showLight = !showLight;
        this.className = 'mode-btn' + (showLight ? ' active-ppl' : '');
        if (showLight) kick(); else redraw();
    });
    document.getElementById('btn-front').addEventListener('click', () => {
        yawAnim = { from: yaw, to: 0, t0: performance.now(), dur: 300 }; kick();
    });

    // ----- 끌어서 돌리기 / 올려보기 / 클릭 -----
    let drag = null;
    function canvasXY(e) {
        const r = cv.getBoundingClientRect();
        return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
    }
    cv.addEventListener('pointerdown', (e) => {
        drag = { x: e.clientX, y: e.clientY, yaw: yaw, moved: false };
        yawAnim = null;
        try { cv.setPointerCapture(e.pointerId); } catch (err) { }
    });
    cv.addEventListener('pointermove', (e) => {
        if (drag) {
            const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
            if (Math.hypot(dx, dy) >= 5) drag.moved = true;
            if (drag.moved) {
                yaw = Math.max(-YAW_MAX, Math.min(YAW_MAX, drag.yaw + dx * 0.4 * Math.PI / 180));
                cv.style.cursor = 'grabbing';
                redraw();
            }
            return;
        }
        const xy = canvasXY(e), lid = labelAt(xy[0], xy[1]), id = lid || pickAt(xy[0], xy[1]);
        cv.style.cursor = id ? 'pointer' : 'default';
        if (id !== hover || lid !== labelHover) { hover = id; labelHover = lid; redraw(); }
    });
    cv.addEventListener('pointerup', (e) => {
        if (!drag) return;
        const moved = drag.moved;
        drag = null;
        try { cv.releasePointerCapture(e.pointerId); } catch (err) { }
        const xy = canvasXY(e), lid = labelAt(xy[0], xy[1]), id = lid || pickAt(xy[0], xy[1]);
        if (!moved && !(lid && lid === sel)) selectPart(id);
        hover = id; labelHover = lid;
        cv.style.cursor = id ? 'pointer' : 'default';
        redraw();
    });
    cv.addEventListener('pointercancel', () => { drag = null; });
    cv.addEventListener('pointerleave', () => { if (!drag && (hover || labelHover)) { hover = null; labelHover = null; redraw(); } });

    // ----- 시작 해시: tab=struct, part=<id>, explode=1 -----
    (function () {
        const h = new URLSearchParams(location.hash.slice(1));
        if (h.get('explode') === '1') { expl = 1; setExplodeLabel(1); }
        const pid = h.get('part');
        if (pid && byId[pid]) sel = pid;
        renderPanel();
        if (h.get('tab') === 'struct' && !LITE) showTab('struct');
    })();
})();
    </script>
</body>
